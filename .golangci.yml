# golangci-lint configuration.
# A sensible, non-noisy set focused on correctness, simplicity, and security.

run:
  timeout: 5m
  tests: true

linters:
  disable-all: true
  enable:
    - govet
    - staticcheck
    - errcheck
    - ineffassign
    - revive
    - gofmt
    - goimports
    - misspell
    - gosec
    - unconvert
    - unparam

linters-settings:
  goimports:
    local-prefixes: kibou/thisisyouryear
  revive:
    rules:
      - name: exported
        disabled: false

issues:
  exclude-rules:
    # Test helpers commonly ignore returned errors deliberately.
    - path: _test\.go
      linters:
        - errcheck
        - gosec
  max-issues-per-linter: 0
  max-same-issues: 0
